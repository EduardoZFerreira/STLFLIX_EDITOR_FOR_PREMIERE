<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"num","type":"string","label":"Numeral do capítulo","default":"1"},
    {"id":"kicker","type":"string","label":"Kicker","default":"COISA 1 DE 5"},
    {"id":"chapterTitle","type":"string","label":"Título do capítulo","default":"As máquinas mudaram"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/tokens.css" />
      <style>
        /* Lettering: sem fill e sem scrim, o vídeo continua visível */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--font-title);
        }
        #cc-panel {
          display: flex;
          align-items: center;
          gap: 40px;
        }
        #cc-num {
          font-size: 150px;
          line-height: 0.9;
          font-weight: 700;
          color: var(--accent);
          letter-spacing: -0.05em;
        }
        #cc-kicker {
          font-family: var(--font-body);
          font-size: 30px;
          font-weight: 600;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--text-dim);
          margin-bottom: 12px;
        }
        #cc-title {
          font-size: 76px;
          font-weight: 700;
          line-height: 1.08;
          letter-spacing: -0.03em;
          color: var(--text);
          max-width: 1000px;
        }
      </style>

      <div id="root" data-composition-id="chapter-card" data-width="1920" data-height="1080">
        <div class="hf-anchor" id="cc-anchor">
          <div class="hf-bar" id="cc-bar"></div>
          <div class="hf-panel" id="cc-panel">
            <div id="cc-num" data-var-text="num">1</div>
            <div id="cc-text">
              <div id="cc-kicker" data-var-text="kicker">COISA 1 DE 5</div>
              <div id="cc-title" data-var-text="chapterTitle">As máquinas mudaram</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#cc-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo("#cc-panel", { opacity: 0, x: -44 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.1);
          tl.fromTo("#cc-num", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.26);
          tl.fromTo("#cc-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.32);
          tl.fromTo("#cc-title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.38);

          // Saída dentro da janela de 2 s do slot: devolve o quadro ao vídeo
          tl.to("#cc-panel", { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 1.6);
          tl.to("#cc-bar", { scaleY: 0, duration: 0.26, ease: "power2.in" }, 1.7);

          window.__timelines["chapter-card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
