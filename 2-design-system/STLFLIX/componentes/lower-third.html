<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Nome","default":"Thales Brandão"},
    {"id":"role","type":"string","label":"Descrição","default":"Impressão 3D"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/tokens.css" />
      <style>
        /* Sem fill e sem scrim: o lower third é sobreposição pura */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--font-title);
        }
        #lt-wrap {
          position: absolute;
          left: 140px;
          bottom: 150px;
          display: flex;
          align-items: stretch;
          gap: 28px;
        }
        #lt-bar {
          width: 10px;
          border-radius: 5px;
          background: var(--accent);
          transform-origin: bottom center;
        }
        #lt-panel {
          background: rgba(21, 22, 30, 0.92);
          border-radius: var(--radius);
          padding: 30px 48px;
          box-shadow: var(--shadow);
          overflow: hidden;
        }
        #lt-name {
          font-size: 62px;
          font-weight: 700;
          letter-spacing: -0.025em;
          color: var(--text);
          line-height: 1.1;
        }
        #lt-role {
          font-family: var(--font-body);
          font-size: 34px;
          font-weight: 600;
          letter-spacing: 0.04em;
          color: var(--text-dim);
          margin-top: 8px;
        }
      </style>

      <div id="root" data-composition-id="lower-third" data-width="1920" data-height="1080">
        <div id="lt-wrap">
          <div id="lt-bar"></div>
          <div id="lt-panel">
            <div id="lt-name" data-var-text="name">Thales Brandão</div>
            <div id="lt-role" data-var-text="role">Impressão 3D</div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#lt-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo("#lt-panel", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.12);
          tl.fromTo("#lt-name", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 0.28);
          tl.fromTo("#lt-role", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 0.4);

          // Entra e sai em ~5 s (plano de cenas, S03)
          tl.to("#lt-panel", { opacity: 0, x: -30, duration: 0.35, ease: "power2.in" }, 4.5);
          tl.to("#lt-bar", { scaleY: 0, duration: 0.3, ease: "power2.in" }, 4.6);

          window.__timelines["lower-third"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
