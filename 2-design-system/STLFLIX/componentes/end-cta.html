<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/tokens.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--font-title);
        }
        #ec-center {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 40px;
        }
        /* --cta: lima, exclusivo de call-to-action (design.md § Cores) */
        #ec-chip {
          display: inline-flex;
          align-items: center;
          gap: 18px;
          padding: 24px 52px;
          border-radius: var(--radius-chip);
          background: var(--cta);
          color: #0d0e14;
          font-family: var(--font-body);
          font-size: 42px;
          font-weight: 700;
        }
        #ec-q {
          font-size: 76px;
          font-weight: 700;
          line-height: 1.12;
          letter-spacing: -0.03em;
          color: var(--text);
          text-align: center;
          max-width: 1400px;
        }
        #ec-foot {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
          margin-top: 26px;
        }
        #ec-logo {
          width: 226px;
          height: 60px;
          display: block;
        }
        #ec-link {
          font-family: var(--font-body);
          font-size: var(--fs-caption);
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--text-dim);
        }
      </style>

      <div id="root" data-composition-id="end-cta" data-width="1920" data-height="1080">
        <div class="hf-fill"></div>
        <div id="ec-center">
          <div id="ec-chip">Like + Inscreva-se</div>
          <div id="ec-q">
            <div>Você já tem uma impressora?</div>
            <div>Ou ainda está na dúvida?</div>
          </div>
          <div id="ec-foot">
            <img id="ec-logo" src="assets/stlflix.svg" alt="STLFLIX" />
            <div id="ec-link">Link na descrição</div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#ec-chip", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.1);
          tl.fromTo("#ec-q", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.55);
          tl.fromTo("#ec-logo", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 1.15);
          tl.fromTo("#ec-link", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.45);

          window.__timelines["end-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
